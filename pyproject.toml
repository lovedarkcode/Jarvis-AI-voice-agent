[project]
name = "jarvis-hosted"
version = "1.0.0"
description = "Self-contained hosted JARVIS runtime"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "google-genai>=2.8.0",
  "ddgs>=9.0",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "openpyxl>=3.1",
]

[tool.vercel]
entrypoint = "api.index:app"
